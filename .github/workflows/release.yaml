name: Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Test
        run: swift test

      # Developer ID Application の証明書と公証用の App Store Connect API キーを一時的なキーチェーンに入れる。
      # シークレットを参照できない PR（fork からの PR など）では何もせず、次のステップで ad-hoc 署名にする
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }} # p12 にパスワードを付けていなければ未設定（空文字）でよい
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "${P12}" ]]; then
            echo "::notice::MACOS_CERT_P12_BASE64 を参照できないため、証明書の取り込みを省略します"
            exit 0
          fi
          kc="${RUNNER_TEMP}/build.keychain-db"
          kcpw="$(uuidgen)"
          security create-keychain -p "${kcpw}" "${kc}"
          security set-keychain-settings -lut 21600 "${kc}"
          security unlock-keychain -p "${kcpw}" "${kc}"
          echo "${P12}" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${kc}" -P "${P12_PASSWORD}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${kcpw}" "${kc}"
          # 既存のキーチェーンを残したまま、作ったキーチェーンを検索リストの先頭に加える
          keychains=()
          while IFS= read -r k; do keychains+=("${k}"); done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "${kc}" "${keychains[@]}"
          echo "${NOTARY_KEY}" | base64 -d > "${RUNNER_TEMP}/notary.p8"
          xcrun notarytool store-credentials cappy-notary \
            --key "${RUNNER_TEMP}/notary.p8" --key-id "${NOTARY_KEY_ID}" --issuer "${NOTARY_ISSUER_ID}" --keychain "${kc}"
          rm -f "${RUNNER_TEMP}/notary.p8"
          # 公証は時間がかかるためタグのときだけ行う（PR では store-credentials で API キーの確認だけをする）。
          # 次のステップの scripts/release.sh に、公証に使うプロファイルとキーチェーンを渡す
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            {
              echo "CAPPY_NOTARY_PROFILE=cappy-notary"
              echo "CAPPY_NOTARY_KEYCHAIN=${kc}"
            } >> "${GITHUB_ENV}"
          fi

      # Developer ID で署名した cappy と gcappy.app の zip を作る。タグのときは公証し、gcappy.app には公証のチケットを staple する。
      # シークレットを参照できない PR では ad-hoc 署名でビルドだけ確かめる
      - name: Build release zip
        id: build
        env:
          CAPPY_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: |
          version="$(sed -n 's/.*current = "\(.*\)"/\1/p' Sources/CappyKit/Core/Version.swift)"
          if [[ "${GITHUB_REF}" == refs/tags/* && "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::タグ ${GITHUB_REF_NAME} と Version.swift の ${version} が一致しません"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* && ( "${CAPPY_SIGN_IDENTITY}" == "-" || -z "${CAPPY_NOTARY_PROFILE:-}" ) ]]; then
            echo "::error::リリースには Developer ID での署名と公証が必要です（シークレットを確認してください）"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          scripts/release.sh "${version}"

      # GitHub App から一時的なトークンを生成（cappy の Release と tap の更新に使う）
      - name: Generate Token
        if: startsWith(github.ref, 'refs/tags/')
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            cappy
            homebrew-cask

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZIP: ${{ steps.build.outputs.zip }}
          APP_ZIP: ${{ steps.build.outputs.app_zip }}
        run: |
          files=("${ZIP}" "${ZIP}.sha256" "${APP_ZIP}" "${APP_ZIP}.sha256")
          # tagpr が Release を作っていればファイルを追加し、なければ作る
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Update Homebrew formula
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          APP_SHA256: ${{ steps.build.outputs.app_sha256 }}
          TAP: ${{ github.repository_owner }}/homebrew-cask
        run: |
          tap_dir="${RUNNER_TEMP}/tap"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" "${tap_dir}"
          mkdir -p "${tap_dir}/Formula"
          scripts/formula.sh "${VERSION}" "${SHA256}" cappy > "${tap_dir}/Formula/cappy.rb"
          scripts/formula.sh "${VERSION}" "${APP_SHA256}" gcappy > "${tap_dir}/Formula/gcappy.rb"
          cd "${tap_dir}"
          if git diff --quiet -- Formula && ! git ls-files --others --exclude-standard | grep -q .; then
            echo "formula に変更はありません"
            exit 0
          fi
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Formula/cappy.rb Formula/gcappy.rb
          git commit -m "Brew formula update for cappy and gcappy version v${VERSION}"
          git push origin HEAD
