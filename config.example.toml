# ~/.config/cappy/config.toml の例
# 認証情報そのものは書かない（Google はアプリケーションデフォルト認証情報を使う）

[profiles.default]
provider = "gemini"          # gemini（Vertex AI）/ google（Speech-to-Text v2）/ none（録音だけ行い、外部へ送信しない）
language = "ja-JP"
output_dir = "~/Recordings/cappy"
# disk_warn_mb = 1024        # 空き容量がこれを下回ったら警告
# disk_stop_mb = 300         # さらに下回ったら録音を安全に停止（終了コード 4）

# Google Cloud の共通設定（project_id と bucket は gemini でも使う）と、provider = "google" のときの設定
[profiles.default.google]
project_id = "my-project"
bucket = "my-cappy-bucket"   # 送信する音声を一時的に置くバケット
delete_remote_after = true   # 文字起こし後にバケット上の音声と結果を削除
# 以下は provider = "google"（Speech-to-Text v2）のときだけ使う
location = "us"
model = "chirp_3"
# word_timestamps = true     # 単語タイムスタンプ（有効時は 1 ファイル約 20 分の制限があるため自動分割）
# chunk_minutes = 19         # 分割長（分）。省略時は word_timestamps に応じて 19 / 59
# diarization = true         # remote トラックで話者分離を試みる
# min_speakers = 1
# max_speakers = 6

# Vertex AI の Gemini による文字起こし（provider = "gemini"、record --live）
[profiles.default.gemini]
# project_id = "my-project"  # 省略時は google.project_id
location = "global"          # global / us / eu
model = "gemini-3.5-transcribe"            # 録音済みファイルの文字起こし
live_model = "gemini-3.5-transcribe-live"  # record --live のリアルタイム文字起こし
# chunk_minutes = 14         # 1 リクエストの長さ（分、1〜15）。話者分離・タイムスタンプ有効時は 15 分まで
# diarization = true         # remote トラックで話者分離（最大 8 人）
# word_timestamps = true     # 単語タイムスタンプ（無効にすると発言の時刻は推定になる）
# custom_vocabulary = ["cappy", "Vertex AI"]  # 認識を寄せたい固有名詞など（1000 語まで）

# 会議の要約（Vertex AI の Claude / Gemini）。認証は上と同じ ADC を使う
[profiles.default.summary]
# provider = "vertex"        # vertex / none（省略時は、上の provider が none なら none、それ以外は vertex）
# project_id = "my-project"  # 省略時は google.project_id
region = "global"            # global / us / eu（us・eu はデータの処理地域を限定できるが約 10% 高い）
model = "gemini-4-argon"     # gemini- で始まれば Gemini、claude- で始まれば Claude（例: "claude-opus-5-5"）
# fallback_model = "claude-opus-4-8"  # 要約を拒否されたときに再試行するモデル（省略時: Claude なら claude-opus-4-8、Gemini なら再試行しない。"" で再試行しない）
effort = "high"              # low / medium / high / xhigh / max（深いほど丁寧だが遅く高い。Gemini 3 以降は thinkingLevel の LOW / MEDIUM / HIGH に対応）
# max_tokens = 32000
auto = false                 # true なら transcribe の後に自動で要約する（--no-summarize で抑止）
# instructions_file = "~/.config/cappy/summary-instructions.md"  # 要約の書き方の追加指示

# AWS の認証（Amazon Transcribe・Bedrock 対応の準備。現在は cappy doctor での確認のみ）
# 認証情報は書かず、~/.aws/config のプロファイル（SSO・アクセスキー・credential_process など）を使う
# [profiles.default.aws]
# profile = "my-sso-profile"   # 省略時は AWS_PROFILE → AWS_DEFAULT_PROFILE → default
# region = "ap-northeast-1"    # 省略時は AWS_REGION → AWS_DEFAULT_REGION → プロファイルの region

# クライアントごとに送信先や保存先を分ける例
[profiles.client-a]
provider = "google"
output_dir = "~/Recordings/client-a"

[profiles.client-a.google]
project_id = "client-a-project"
location = "eu"
bucket = "client-a-cappy"

# 外部送信が許されない案件
[profiles.local-only]
provider = "none"
output_dir = "~/Recordings/local-only"
