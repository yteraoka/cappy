# ~/.config/cappy/config.toml の例（英語版は config.example.toml）
# `cappy init` で対話して設定ファイルを作れます。このファイルはすべての設定の一覧です
# 認証情報そのものは書かない（Google はアプリケーションデフォルト認証情報、AWS は ~/.aws のプロファイルを使う）
#
# プロファイルの構成:
#   [profiles.<name>]                  会議の言語・保存先
#   [profiles.<name>.google] / .aws    文字起こしと要約で共通のクラウドのアカウント
#   [profiles.<name>.transcribe]       文字起こし: provider（どのクラウドか）と model（何を使うか）
#   [profiles.<name>.summary]          会議の要約: provider（どのクラウドか）と model（何を使うか）

[profiles.default]
language = "ja-JP"           # 会議の言語。transcript.md・summary.md の見出しや話者名もこれに合わせる
output_dir = "~/Recordings/cappy"
# disk_warn_mb = 1024        # 空き容量がこれを下回ったら警告
# disk_stop_mb = 300         # さらに下回ったら録音を安全に停止（終了コード 4）

# Google Cloud のアカウント（文字起こし・要約の provider = "google" で使う）
[profiles.default.google]
project_id = "my-project"
bucket = "my-cappy-bucket"   # 送信する音声を一時的に置くバケット
delete_remote_after = true   # 文字起こし後にバケット上の音声と結果を削除

# 文字起こし
[profiles.default.transcribe]
provider = "google"          # google / aws / none（録音だけ行い、外部へ送信しない）
# provider = "google" では、gemini-* なら Vertex AI の Gemini、それ以外（chirp_3 など）なら Speech-to-Text v2
model = "gemini-3.5-transcribe"
location = "global"          # Gemini: global / us / eu（既定 global）。Speech-to-Text: us / eu / asia-northeast1 など（既定 us）
live_model = "gemini-3.5-transcribe-live"  # provider = "google" での record --live（Gemini の Live API）に使うモデル
# chunk_minutes = 14         # 1 リクエストの長さ（分）。Gemini: 1〜15（既定 14）。Speech-to-Text: 既定は word_timestamps に応じて 19 / 59
# diarization = true         # remote トラックで話者分離
# word_timestamps = true     # 単語タイムスタンプ（Gemini: 無効にすると発言の時刻は推定。Speech-to-Text: 有効時は 1 ファイル約 20 分の制限があるため自動分割）
# custom_vocabulary = ["cappy", "Vertex AI"]  # Gemini: 認識を寄せたい固有名詞など（1000 語まで）
# min_speakers = 1           # Speech-to-Text
# max_speakers = 6           # Speech-to-Text、Amazon Transcribe（2〜30）
# vocabulary_name = "cappy-terms"     # Amazon Transcribe: 事前に登録したカスタム語彙（同じリージョン・言語）
# language_model_name = "my-model"    # Amazon Transcribe: 事前に作成したカスタム言語モデル

# 会議の要約
[profiles.default.summary]
# provider = "google"        # google（Vertex AI）/ aws（Amazon Bedrock）/ none。省略時は transcribe.provider と同じ
# project_id = "my-project"  # 省略時は google.project_id
region = "global"            # google: global / us / eu（us・eu はデータの処理地域を限定できるが約 10% 高い）
model = "gemini-4-argon"     # gemini- で始まれば Gemini、claude- で始まれば Claude（例: "claude-opus-5-5"）
# fallback_model = "claude-opus-4-8"  # 要約を拒否されたときに再試行するモデル（省略時: Claude なら claude-opus-4-8、Gemini なら再試行しない。"" で再試行しない）
effort = "high"              # low / medium / high / xhigh / max（深いほど丁寧だが遅く高い。Gemini 3 以降は thinkingLevel の LOW / MEDIUM / HIGH に対応）
# max_tokens = 32000
auto = false                 # true なら transcribe の後に自動で要約する（--no-summarize で抑止）
# instructions_file = "~/.config/cappy/summary-instructions.md"  # 要約の書き方の追加指示
# prompt = "minutes"         # 構成のテンプレート（~/.config/cappy/prompts/minutes.md、または .md のパス。省略時は組み込みの default）

# AWS のアカウント（文字起こし・要約の provider = "aws" で使う）
# 認証情報は書かず、~/.aws/config のプロファイル（SSO・アクセスキー・credential_process など）を使う
# [profiles.default.aws]
# profile = "my-sso-profile"   # 省略時は AWS_PROFILE → AWS_DEFAULT_PROFILE → default
# region = "ap-northeast-1"    # 省略時は AWS_REGION → AWS_DEFAULT_REGION → プロファイルの region
# bucket = "my-cappy-bucket"   # Amazon Transcribe に送る音声を一時的に置く S3 バケット（同じリージョン）
# delete_remote_after = true   # 文字起こし後に S3 上の音声と Transcribe のジョブを削除

# Amazon Transcribe で文字起こしし、Bedrock の Claude で要約する例
[profiles.aws]

[profiles.aws.aws]
region = "ap-northeast-1"
bucket = "my-cappy-bucket"

# record --live も Amazon Transcribe Streaming を使う（同じ設定が効く）
[profiles.aws.transcribe]
provider = "aws"
diarization = true           # remote トラックで話者分離
max_speakers = 10            # 話者分離の最大人数（2〜30）

[profiles.aws.summary]
# provider = "aws"           # 省略時は transcribe.provider と同じ
region = "jp"                # 推論プロファイルの範囲: global / jp / us / eu / au / apac、またはリージョン名（そのリージョンだけで処理）

# Vertex AI の Gemini で文字起こしし、Amazon Bedrock で要約する例
# プロファイルはほかのプロファイルの設定を引き継がないため、文字起こしに使う Google Cloud の設定もここに書く
[profiles.bedrock]

[profiles.bedrock.google]
project_id = "my-project"
bucket = "my-cappy-bucket"

[profiles.bedrock.aws]
region = "ap-northeast-1"

[profiles.bedrock.transcribe]
provider = "google"

[profiles.bedrock.summary]
provider = "aws"
region = "jp"
model = "claude-opus-5-5"    # 省略時は claude-opus-5-5。jp.anthropic.claude-opus-5-5 のような Bedrock のモデル ID も可
# model = "global.moonshotai.kimi-k3.1"  # Claude 以外（Kimi K3.1、GLM-5.3 = "global.zai.glm-5.3" など）も可。東京では global のみ
effort = "high"

# Speech-to-Text を使い、クライアントごとに送信先や保存先を分ける例
[profiles.client-a]
output_dir = "~/Recordings/client-a"

[profiles.client-a.google]
project_id = "client-a-project"
bucket = "client-a-cappy"

[profiles.client-a.transcribe]
provider = "google"
model = "chirp_3"
location = "eu"

# 外部送信が許されない案件
[profiles.local-only]
output_dir = "~/Recordings/local-only"

[profiles.local-only.transcribe]
provider = "none"            # summary.provider を書かなければ要約も none
